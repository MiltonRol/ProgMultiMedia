<?xml version="1.0" encoding="UTF-8"?>
<!-- Cruz (jugador X). Dos líneas en diagonal con extremos redondeados.
     viewBox 100x100: así las coordenadas son "porcentajes" fáciles de leer.
     Equivalente Android: app/src/main/res/drawable/ic_cross.xml -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <path d="M20,20 L80,80 M80,20 L20,80"
        fill="none" stroke="#4FC3F7" stroke-width="14" stroke-linecap="round"/>
</svg>
